<!doctype html>
<html lang="ko" data-theme="07"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학부모 로그인 | 톡톡수학</title><link rel="stylesheet" href="all-site.css"></head>
<body><header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="all01.html"><span class="brand-symbol">톡</span><span>톡톡수학<small>보호자 리포트</small></span></a><a href="all04-student-login.html">학생 계정 로그인</a></div></header><main class="role-login"><div class="wrap role-login-wrap"><p class="breadcrumbs"><a href="all03-login.html">로그인 선택</a> / 보호자</p><div class="login-card"><p class="eyebrow">PARENT / GUARDIAN</p><h1>아이의 한 주를<br>함께 살펴보세요.</h1><p class="login-intro">보호자 계정으로 연결된 자녀의 학습 요약만 확인할 수 있어요.</p><form class="login-form" id="login"><label>보호자 이메일<input name="email" type="email" autocomplete="username" placeholder="가입한 이메일" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required></label><button class="btn" type="submit">보호자로 로그인 →</button><div class="login-status" role="status" aria-live="polite"></div></form><p class="login-foot">자녀 연결은 보호자 확인 절차를 거쳐 진행하도록 설계합니다.</p><p class="login-foot"><a href="all07-parent-report.html">샘플 보호자 리포트 미리보기 (인증 없음)</a></p></div><p class="notice">데모 화면입니다. 운영 시 보호자 인증과 자녀 연결 관계를 서버에서 검증해야 합니다.</p></div></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.querySelector('.login-status').textContent='데모에서는 계정 인증을 진행하지 않습니다.'});</script></body></html>

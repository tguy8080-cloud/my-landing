<!doctype html>
<html lang="ko" data-theme="07"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 로그인 | 톡톡수학</title><link rel="stylesheet" href="all-site.css"></head>
<body><header class="topbar"><div class="wrap topbar-inner"><a class="brand" href="all01.html"><span class="brand-symbol">톡</span><span>톡톡수학<small>학생 학습 공간</small></span></a><a href="all05-parent-login.html">학부모 계정 로그인</a></div></header><main class="role-login"><div class="wrap role-login-wrap"><p class="breadcrumbs"><a href="all03-login.html">로그인 선택</a> / 학생</p><div class="login-card"><p class="eyebrow">STUDENT SPACE</p><h1>오늘의 공부를<br>이어가 볼까요?</h1><p class="login-intro">학생 계정으로 로그인해 수강 강의와 과제 피드백을 확인해요.</p><form class="login-form" id="login"><label>학생 아이디<input name="id" autocomplete="username" placeholder="아이디를 입력해 주세요" required></label><label>비밀번호<input type="password" name="password" autocomplete="current-password" placeholder="비밀번호를 입력해 주세요" required></label><button class="btn" type="submit">학생으로 로그인 →</button><div class="login-status" role="status" aria-live="polite"></div></form><p class="login-foot">실제 서비스 연결 전의 데모입니다. 실제 비밀번호를 입력하지 마세요.</p><p class="login-foot"><a href="all06-student-report.html">샘플 학생 리포트 미리보기 (인증 없음)</a></p></div><p class="notice">운영 시 서버가 학생 계정과 해당 학생의 수강 권한을 검증한 뒤 학생용 화면을 반환해야 합니다.</p></div></main><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();e.currentTarget.querySelector('.login-status').textContent='데모에서는 계정 인증을 진행하지 않습니다.'});</script></body></html>
